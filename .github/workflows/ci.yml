name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify all commits carry Signed-off-by (DCO)
        run: |
          set -e
          BASE="${GITHUB_EVENT_PULL_REQUEST_BASE_SHA:-${{ github.event.pull_request.base.sha }}}"
          HEAD="${GITHUB_EVENT_PULL_REQUEST_HEAD_SHA:-${{ github.event.pull_request.head.sha }}}"
          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            echo "Skipping DCO check outside pull_request context"
            exit 0
          fi
          bad=""
          for c in $(git rev-list "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q "^Signed-off-by: "; then
              echo "::error::commit $c is missing Signed-off-by trailer (DCO)"
              bad=1
            fi
          done
          if [ -n "$bad" ]; then
            echo "All commits must include a Signed-off-by trailer. Use: git commit -s"
            exit 1
          fi
          echo "DCO check passed"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short || echo "No pytest tests, running CLI smoke"
      - name: CLI smoke test
        run: |
          python -m pip install -e .
          for cmd in witnessos-rogue-agent-audit ajson witnessos-compliance witnessos-rogue-agent-audit; do
            command -v $cmd >/dev/null 2>&1 && $cmd --help >/dev/null 2>&1 && echo "PASS: $cmd" || true
          done
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Bandit scan
        run: bandit -r . -f json || true
      - name: Secrets scan
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3

  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run OSV-Scanner
        uses: google/osv-scanner/actions/scanner@v1
        with:
          scan-args: |-
            --recursive
            .
            --fail-on-vuln

